name: Publish current Leveler version to Foundry

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Testlauf"
        required: true
        type: boolean
        default: true

jobs:
  publish-current-version-to-foundry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish to Foundry
        run: node ./.github/scripts/publish_to_foundry.mjs
        env:
          AUTH_TOKEN: ${{ secrets.FOUNDRY_VTT_PUBLISH_TOKEN }}
          MODULE_JSON_PATH: ./module.json
          DRY_RUN: ${{ github.event.inputs.dryRun }}
