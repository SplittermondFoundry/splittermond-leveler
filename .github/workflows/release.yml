name: Release Leveler

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix, for example 0.1.17"
        required: true
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_URL: https://github.com/SplittermondFoundry/splittermond-leveler
      MANIFEST_URL: https://github.com/SplittermondFoundry/splittermond-leveler/releases/latest/download/module.json
      FOUNDRY_TOKEN_AVAILABLE: ${{ secrets.FOUNDRY_VTT_PUBLISH_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve release metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v${VERSION}"
          ZIP_FILE="splittermond-leveler-${VERSION}.zip"
          DOWNLOAD_URL="${REPOSITORY_URL}/releases/download/${TAG}/${ZIP_FILE}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "ZIP_FILE=${ZIP_FILE}" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=${DOWNLOAD_URL}" >> "$GITHUB_ENV"

      - name: Set version in module.json
        run: node ./.github/scripts/index.cjs
        env:
          fileToUpdate: ./module.json
          version: ${{ env.VERSION }}

      - name: Set release URLs in module.json
        run: node ./.github/scripts/replace_links.cjs
        env:
          fileToUpdate: ./module.json
          newManifest: ${{ env.MANIFEST_URL }}
          newDownload: ${{ env.DOWNLOAD_URL }}

      - name: Validate module
        run: |
          node --check scripts/let-me-skill.js
          node --check scripts/advancement-rules.js
          node --check scripts/panel-layout.js
          node --check scripts/sheet-scroll.js
          node -e "JSON.parse(require('fs').readFileSync('module.json', 'utf8')); console.log('module.json valid')"
          node tests/advancement-rules.test.mjs
          node tests/panel-layout.test.mjs
          node tests/sheet-scroll.test.mjs

      - name: Create Foundry package zip
        shell: bash
        run: zip -r "${ZIP_FILE}" module.json scripts styles templates LICENSE

      - name: Upload release assets
        uses: softprops/action-gh-release@v2.3.2
        with:
          generate_release_notes: true
          draft: false
          tag_name: ${{ env.TAG }}
          files: |
            ${{ env.ZIP_FILE }}
            module.json

      - name: Publish release to Foundry package admin
        if: env.FOUNDRY_TOKEN_AVAILABLE == 'true'
        run: node ./.github/scripts/publish_to_foundry.mjs
        env:
          AUTH_TOKEN: ${{ secrets.FOUNDRY_VTT_PUBLISH_TOKEN }}
          MODULE_JSON_PATH: ./module.json
          DRY_RUN: "false"
